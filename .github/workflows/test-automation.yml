name: Test Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Test Python environment
        run: |
          python --version
          pip --version
      
      - name: Install minimal dependencies
        run: |
          pip install requests
      
      - name: Test data collector
        run: |
          python scripts/data_collector.py
      
      - name: Check if data was created
        run: |
          ls -la data/ || echo "Data directory not found"
          cat data/latest_prices.json || echo "Data file not found"
