name: EnergieRapport Auto-Update

on:
  schedule:
    # Dagelijks om 19:30 UTC (20:30 CET)
    - cron: '30 19 * * *'
    # Wekelijks zondag om 19:30 UTC (20:30 CET)
    - cron: '30 19 * * 0'
  workflow_dispatch:
    inputs:
      force_ai_analysis:
        description: 'Force AI analysis (weekly mode)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements-automation.txt
      
      - name: Determine update mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] && [ "${{ github.event.schedule }}" == "0 19 * * 0" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.force_ai_analysis }}" == "true" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          else
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi
      
      - name: Collect energy market data
        id: collect
        run: |
          python scripts/data_collector.py
        env:
          DATA_MODE: ${{ steps.mode.outputs.mode }}
      
      - name: Detect crisis situation
        id: crisis
        if: steps.mode.outputs.mode == 'daily'
        run: |
          python scripts/crisis_detector.py
          if [ -f "data/crisis_detected.txt" ]; then
            CRISIS_DETECTED=$(cat data/crisis_detected.txt)
            echo "crisis_detected=$CRISIS_DETECTED" >> $GITHUB_OUTPUT
          else
            echo "crisis_detected=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run AI analysis
        if: steps.mode.outputs.mode == 'weekly' || steps.crisis.outputs.crisis_detected == 'true'
        run: |
          python scripts/ai_analyzer.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_TRIGGER: ${{ steps.crisis.outputs.crisis_detected == 'true' && 'crisis' || 'weekly' }}
      
      - name: Update report files
        run: |
          python scripts/report_updater.py
        env:
          UPDATE_MODE: ${{ steps.mode.outputs.mode }}
      
      - name: Validate HTML/JSX synchronization
        run: |
          echo "🔍 Validating offline.html and JSX synchronization..."
          
          # Check if both files exist
          if [ ! -f "src/EnergieRapport.jsx" ] || [ ! -f "public/offline.html" ]; then
            echo "::error::Missing report files"
            exit 1
          fi
          
          SYNC_FAILED=0
          
          # Structural validation: Check that critical SECTIONS exist in both files
          CRITICAL_SECTIONS=(
            "KERNBOODSCHAP"
            "Waarom variabel op de .* lange termijn"
            "Belgische wet: consumentenbescherming"
            "Wanneer is een vast tarief dan wél verantwoord"
            "Adviesmatrix per Profiel"
            "IEA Strategische Oliereserves"
            "Europese Gasvoorraden"
            "Geopolitieke Crisissituatie"
          )
          
          echo "Checking structural sections..."
          for section in "${CRITICAL_SECTIONS[@]}"; do
            if ! grep -qE "$section" src/EnergieRapport.jsx; then
              echo "::error::SYNC FAILED - Section missing in JSX: '$section'"
              SYNC_FAILED=1
            fi
            if ! grep -qE "$section" public/offline.html; then
              echo "::error::SYNC FAILED - Section missing in HTML: '$section'"
              SYNC_FAILED=1
            fi
          done
          
          # Check for timestamp consistency
          echo "Checking timestamp consistency..."
          JSX_TIME=$(grep -oP "MARKTANALYSE — \d{2} \w+ \d{4} · \K\d{2}:\d{2}" src/EnergieRapport.jsx | head -1)
          HTML_TIME=$(grep -oP "MARKTANALYSE — \d{2} \w+ \d{4} · \K\d{2}:\d{2}" public/offline.html | head -1)
          
          if [ "$JSX_TIME" != "$HTML_TIME" ]; then
            echo "::error::Timestamp mismatch - JSX: $JSX_TIME, HTML: $HTML_TIME"
            SYNC_FAILED=1
          fi
          
          # Word count similarity check (allows content variation but catches major desync)
          echo "Checking content volume similarity..."
          JSX_WORDS=$(grep -oE '\w+' src/EnergieRapport.jsx | wc -l)
          HTML_WORDS=$(grep -oE '\w+' public/offline.html | wc -l)
          
          # Calculate percentage difference
          DIFF=$((JSX_WORDS - HTML_WORDS))
          DIFF_ABS=${DIFF#-}  # Absolute value
          PERCENT=$((DIFF_ABS * 100 / JSX_WORDS))
          
          echo "Word count: JSX=$JSX_WORDS, HTML=$HTML_WORDS, Diff=$PERCENT%"
          
          # Allow up to 15% difference (accounts for JSX syntax overhead and minor variations)
          if [ $PERCENT -gt 15 ]; then
            echo "::error::Content volume mismatch: ${PERCENT}% difference (threshold: 15%)"
            echo "::error::This suggests major content desynchronization"
            SYNC_FAILED=1
          fi
          
          if [ $SYNC_FAILED -eq 1 ]; then
            echo "::error::❌ HTML/JSX synchronization validation FAILED"
            echo "::error::The offline.html is NOT structurally in sync with JSX"
            echo "::error::Manual intervention required - check section presence and content volume"
            exit 1
          fi
          
          echo "✅ HTML/JSX synchronization validated successfully"
          echo "   - All critical sections present in both files"
          echo "   - Timestamps match"
          echo "   - Content volume within acceptable range (${PERCENT}% difference)"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/EnergieRapport.jsx public/offline.html UPDATE_LOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: EnergieRapport data (${{ steps.mode.outputs.mode }} mode) - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      
      - name: Build completed notification
        if: success()
        run: |
          echo "✅ EnergieRapport data update completed successfully!"
          echo "📊 Mode: ${{ steps.mode.outputs.mode }}"
          echo "🔄 Next scheduled run: Daily at 20:30 CET"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::EnergieRapport update failed in ${{ steps.mode.outputs.mode }} mode"
